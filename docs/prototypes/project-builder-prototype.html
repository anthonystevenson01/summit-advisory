<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Project Builder · Summit Strategy Advisory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#F5F9F6; --ink:#053030; --body:#005A66; --accent:#319A65;
  --card:#FFFFFF; --border:#C5D8CE; --tint:#DCF0E5;
  --sel-bg:#053030; --sel-ink:#FFFFFF; --sel-sub:#D6EDE3;
  --bp:#053030; --bp-ink:#FFFFFF; --bp-body:#D6EDE3; --bp-rule:#4A8E8E; --bp-grid:rgba(49,154,101,.16);
  --warn:#8A4B00; --warn-bg:#FFF3E0; --scrim:rgba(5,48,48,.55);
  --display:'Oswald','Arial Narrow',Arial,sans-serif;
  --text:'Carlito',Calibri,Arial,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surface:#053030; --ink:#FFFFFF; --body:#D6EDE3; --card:#0A3D3D; --border:#2E7D6B; --tint:#0A3D3D;
    --sel-bg:#319A65; --sel-ink:#FFFFFF; --sel-sub:#FFFFFF; --bp:#0A3D3D; --bp-grid:rgba(49,154,101,.2);
    --warn:#FFD9A8; --warn-bg:#3A2A10; --scrim:rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:#053030; --ink:#FFFFFF; --body:#D6EDE3; --card:#0A3D3D; --border:#2E7D6B; --tint:#0A3D3D;
  --sel-bg:#319A65; --sel-ink:#FFFFFF; --sel-sub:#FFFFFF; --bp:#0A3D3D; --bp-grid:rgba(49,154,101,.2);
  --warn:#FFD9A8; --warn-bg:#3A2A10; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--surface);color:var(--body);font-family:var(--text);font-size:18px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 18px;border-bottom:2px solid var(--body)}
.mark{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:3px;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;gap:10px}
.mark svg{width:30px;height:16px;flex:none}
.mark .sub{letter-spacing:1px;font-weight:400;text-transform:none;color:var(--body);font-size:18px}
@media (max-width:520px){.mark .sub{display:none}}
.tools{display:flex;align-items:center;gap:6px}
.ghost{background:none;border:0;color:var(--body);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px}
.hero{padding:40px 0 28px;max-width:800px}
.hero h1{font-family:var(--display);font-weight:700;color:var(--ink);font-size:clamp(34px,5.2vw,62px);line-height:1.05;margin:0 0 14px}
.hero p{margin:0;font-size:20px;max-width:62ch}
.grid{display:grid;grid-template-columns:minmax(0,1fr);max-width:920px;gap:40px;padding-bottom:64px}
.grid>*{min-width:0}
@media (max-width:960px){.grid{grid-template-columns:1fr}}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:14px;padding:14px 0 12px;margin-bottom:24px;border-bottom:2px solid var(--border)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--surface)}
.arrow{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:8px 14px;font-weight:700;cursor:pointer;white-space:nowrap;margin-top:2px}
.arrow.next{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.arrow.hide{visibility:hidden}
.arrow span[aria-hidden]{font-size:20px;line-height:1}
.steps{--p:0;list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative}
.steps::before,.steps::after{content:"";position:absolute;top:17px;height:3px;left:calc(100%/12)}
.steps::before{right:calc(100%/12);background:var(--border)}
.steps::after{width:calc(100% * 5 / 6 * var(--p));background:var(--accent);transition:width .35s ease}
@media (prefers-reduced-motion:reduce){.steps::after{transition:none}}
.steps li{display:flex;justify-content:center;min-width:0}
.steps button{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--body);font-size:13px;line-height:1.15;padding:0 2px;text-align:center;min-width:0}
.steps .d{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:16px;border:2px solid var(--border);background:var(--card);color:var(--body);position:relative;z-index:1}
.steps button.done .d{background:var(--accent);border-color:var(--accent);color:#FFFFFF}
.steps button[aria-current="step"] .d{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink);box-shadow:0 0 0 4px var(--tint)}
.steps button[aria-current="step"] .lbl{color:var(--ink);font-weight:700}
.steps button:hover .lbl{text-decoration:underline}
.now{display:none;grid-column:1/-1;margin:0;text-align:center;font-size:15px;color:var(--ink);font-weight:700}
@media (max-width:700px){
 .steps .lbl,.arrow .t{display:none}
 .arrow{padding:8px 11px}
 .steps .d{width:26px;height:26px;font-size:13px}
 .steps::before,.steps::after{top:12px}
 .now{display:block}
}
.stage h2{font-family:var(--display);font-weight:600;color:var(--ink);font-size:34px;line-height:1.1;margin:0 0 8px}
.stage .lede{margin:0 0 20px;max-width:62ch}
.stage .subh,.studio .subh{font-family:var(--display);font-weight:600;color:var(--ink);font-size:26px;line-height:1.15;margin:40px 0 6px;padding-top:24px;border-top:2px solid var(--border)}
.stage h2+.lede+.subh{margin-top:8px;padding-top:0;border-top:0}
.field{margin:0 0 22px}
.field label,.field .lab{display:block;font-weight:700;color:var(--ink);margin-bottom:6px}
.field .hint{font-size:16px;margin:-2px 0 8px}
input[type=text],input[type=email],textarea,select{width:100%;background:var(--card);border:2px solid var(--border);padding:11px 12px;color:var(--ink);border-radius:0}
textarea{min-height:100px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--body);opacity:.7}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:620px){.two{grid-template-columns:1fr}}
.btn{border:2px solid var(--sel-bg);background:var(--sel-bg);color:var(--sel-ink);padding:11px 18px;cursor:pointer;font-weight:700}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.small{padding:7px 14px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn .spark{color:var(--accent);margin-right:6px}
.btn:not(.alt) .spark{color:var(--sel-sub)}

/* assist strip */
.assist{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--tint);border-left:5px solid var(--accent);padding:12px 16px;margin:0 0 6px}
.assist p{margin:0;font-size:16px;color:var(--ink);flex:1 1 240px}
.assist .acts{display:flex;gap:8px;flex-wrap:wrap}
.status{font-size:16px;margin:6px 0 18px;min-height:1.4em;color:var(--ink)}
.starters{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.starter{border:1px dashed var(--body);background:transparent;color:var(--body);padding:4px 10px;font-size:15px;cursor:pointer}

.paths{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
.sysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.sys{text-align:left;border:2px solid var(--border);background:var(--card);padding:10px 12px;cursor:pointer;color:var(--ink);font-weight:700}
.sys[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.repl{border-top:2px solid var(--border);margin-top:8px;padding-top:22px}
.repl h3{font-family:var(--display);font-weight:600;color:var(--ink);font-size:24px;margin:0 0 4px}
.repl .sub{margin:0 0 12px;font-size:16px}
.repl section{margin:0 0 26px}
@media (max-width:700px){.paths{grid-template-columns:1fr}}
.path{text-align:left;background:var(--card);border:2px solid var(--border);padding:18px;cursor:pointer;color:var(--body)}
.path strong{display:block;font-size:20px;color:var(--ink);margin-bottom:4px}
.path[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-sub)}
.path[aria-pressed="true"] strong{color:var(--sel-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--border);background:var(--card);padding:8px 14px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.feat{position:relative;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left;background:var(--card);border:2px solid var(--border);padding:14px 14px 16px;cursor:pointer;color:var(--body);min-height:112px}
.feat strong{display:block;color:var(--ink);font-size:18px;margin-bottom:4px;padding-right:64px}
.feat .d{font-size:16px;line-height:1.35;display:block}
.feat .pri{position:absolute;top:12px;right:12px;font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:2px 7px}
.feat[data-p="Must"]{border-color:var(--ink);box-shadow:inset 6px 0 0 var(--accent)}
.feat[data-p="Must"] .pri{background:var(--sel-bg);color:var(--sel-ink)}
.feat[data-p="Should"]{border-color:var(--body)}
.feat[data-p="Should"] .pri{background:var(--tint);color:var(--ink);border:1px solid var(--body)}
.feat[data-p="Could"] .pri{border:1px dashed var(--body);color:var(--body)}
.legend{font-size:16px;margin:0 0 16px}
.adder{display:grid;grid-template-columns:1fr 150px auto;gap:8px;margin-top:6px}
@media (max-width:620px){.adder{grid-template-columns:1fr 1fr}.adder input{grid-column:1/-1}}
.items{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--border)}
.items li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.items li .t{flex:1;color:var(--ink)}
.items li .tags{display:block;font-size:14px;color:var(--body);margin-top:2px}
.pbtn{font-family:var(--display);font-size:14px;font-weight:600;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--body);background:var(--tint);color:var(--ink);padding:3px 8px;cursor:pointer;min-width:68px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:2px solid var(--border);padding:14px 16px;cursor:pointer;color:var(--body)}
.opt strong{display:block;color:var(--ink)}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--body);margin-top:3px}
.opt[aria-checked="true"]{border-color:var(--ink)}
.opt[aria-checked="true"] .dot{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--card)}

/* smart step */
.ideas{display:grid;gap:12px}
.idea{background:var(--card);border:2px solid var(--border);padding:16px 18px}
.idea.on{border-color:var(--ink);box-shadow:inset 6px 0 0 var(--accent)}
.idea.off{opacity:.6}
.idea h3,.idea h4{font-family:var(--display);font-weight:600;color:var(--ink);font-size:22px;margin:0 0 4px}
.idea p{margin:0 0 8px}
.idea .meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tag{display:inline-block;font-family:var(--display);font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:1px 7px;border:1px solid var(--body);color:var(--ink)}
.idea .small{font-size:16px}
.idea .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.idea .acts button{border:1px solid var(--body);background:transparent;color:var(--ink);padding:5px 10px;cursor:pointer;font-size:15px}
.idea .acts button[aria-pressed="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-ink)}
.loading{display:flex;align-items:center;gap:12px;padding:20px;border:2px dashed var(--border);color:var(--ink)}
.loading i{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.loading i{animation:none}}

/* submit */
.checks{list-style:none;margin:0 0 26px;padding:0;border-top:1px solid var(--border)}
.checks li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);color:var(--ink)}
.checks .ok{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:700}
.checks .ok.y{background:var(--accent);color:#fff}
.checks .ok.n{border:2px solid var(--warn);color:var(--warn)}
.checks li span.t{flex:1}
.sum{display:grid;grid-template-columns:200px 1fr;border-top:1px solid var(--border);margin:0 0 26px}
.sum dt,.sum dd{margin:0;padding:9px 0;border-bottom:1px solid var(--border)}
.sum dt{font-weight:700;color:var(--ink);padding-right:14px}
@media (max-width:620px){.sum{grid-template-columns:1fr}.sum dt{border-bottom:0;padding-bottom:0}}
.panel{background:var(--card);border:2px solid var(--border);padding:20px;margin:0 0 20px}
.panel h3{font-family:var(--display);font-weight:600;color:var(--ink);font-size:22px;margin:0 0 6px}
.err{color:var(--warn);background:var(--warn-bg);padding:8px 12px;font-size:16px;margin:0 0 14px}
.consent{font-size:15px;margin:4px 0 16px}
.consent label{display:flex;gap:8px;align-items:flex-start;font-weight:400;color:var(--body)}
.done{max-width:760px;padding:10px 0 60px}
.done h2{font-family:var(--display);font-weight:700;color:var(--ink);font-size:clamp(32px,4.6vw,52px);line-height:1.05;margin:0 0 12px}
.done .big{font-size:20px;max-width:58ch}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;padding-top:20px;border-top:2px solid var(--border)}

/* blueprint */
.bp{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background-color:var(--bp);color:var(--bp-body);padding:24px 24px 26px;
  background-image:linear-gradient(var(--bp-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bp-grid) 1px,transparent 1px);background-size:24px 24px;border:2px solid var(--accent)}
@media (max-width:960px){.bp{position:static}}
.bp .k{font-family:var(--display);font-weight:500;color:var(--accent);font-size:16px;letter-spacing:2px;text-transform:uppercase}
.bp h3{font-family:var(--display);color:var(--bp-ink);font-size:28px;line-height:1.1;margin:6px 0 16px;word-break:break-word}
.meter{height:10px;background:rgba(255,255,255,.12);margin:4px 0 6px}
.meter i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
.bp .row{display:flex;justify-content:space-between;font-size:16px}
.counts{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0;border:1px solid var(--bp-rule)}
.counts div{padding:10px 8px;text-align:center}
.counts div+div{border-left:1px solid var(--bp-rule)}
.counts b{display:block;font-family:var(--display);font-size:34px;line-height:1;color:var(--bp-ink)}
.counts span{font-size:14px}
.bp ul{list-style:none;margin:0;padding:0}
.bp li{font-size:16px;padding:7px 0;border-top:1px solid var(--bp-rule)}
.bp li b{color:var(--bp-ink)}
.bp .empty{font-size:16px;font-style:italic}
.bp .gapline{margin-top:16px;padding:10px 12px;border:1px solid var(--accent);font-size:16px;color:var(--bp-ink)}

/* business context */
.namef{margin:0 0 26px}
.namef label{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.15}
.namef input{font-size:20px;padding:13px 14px}
.biz{margin:0 0 8px}
.biz h3{font-family:var(--display);font-weight:600;color:var(--ink);font-size:26px;margin:0 0 4px}
.biz .sub{margin:0 0 16px;font-size:16px}
.bact{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin:0 0 14px}
.bact .hint{font-size:15px}
.bstat{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:16px;margin:0 0 14px}
.spin{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.profile{border-top:2px solid var(--border);padding:14px 0 12px}
.profile .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--ink)}
.profile dl{display:grid;grid-template-columns:190px 1fr;margin:0 0 8px}
.profile dt,.profile dd{margin:0;padding:6px 0;border-bottom:1px solid var(--border);font-size:16px}
.profile dt{font-weight:700;color:var(--ink);padding-right:12px}
@media (max-width:620px){.profile dl{grid-template-columns:1fr}.profile dt{border-bottom:0;padding-bottom:0}}
.profile .small{font-size:15px;margin:6px 0 0}
.dbiz{border:1px solid var(--bp-rule);padding:10px 12px;margin:10px 0}
.dbiz p{margin:4px 0 0;font-size:15px}
/* studio */
.studio-wrap{max-width:none!important;display:block!important}
.studio .sbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px;border-bottom:2px solid var(--border);margin-bottom:12px}
.studio .sbar h2{font-family:var(--display);font-weight:600;color:var(--ink);font-size:34px;margin:0}
.studio .sacts{display:flex;flex-wrap:wrap;gap:8px}
.stbl{width:100%;border-collapse:collapse;font-size:16px}.stbl th,.stbl td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);color:var(--ink)}
.stbl th{font-family:var(--display);font-weight:500}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start;padding-bottom:60px}
@media (max-width:960px){.sgrid{grid-template-columns:1fr}}
.sside{position:sticky;top:16px;background:var(--bp);color:var(--bp-body);padding:18px;font-size:15px}
.sside .k{font-family:var(--display);color:var(--accent);letter-spacing:2px;text-transform:uppercase;font-size:14px;margin-bottom:8px}
.sside strong{color:var(--bp-ink)}.sside ul{padding-left:18px}
.reqed .rq{display:grid;grid-template-columns:80px minmax(0,1fr) 140px auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--border)}
.reqed .rq textarea{min-height:44px}.reqed .rid{font-family:var(--display);color:var(--ink);padding-top:10px}
.reqed .src,.reqed .acc{grid-column:2/-1;font-size:14px;margin:0}
@media (max-width:620px){.reqed .rq{grid-template-columns:1fr}.reqed .src,.reqed .acc{grid-column:auto}}
.rep.preview{border:2px solid var(--border);margin:10px 0 60px}
.rep{--ink:#053030;--body:#005A66;--acc:#319A65;--line:#C5D8CE;font-family:Carlito,Calibri,Arial,sans-serif;color:var(--body);background:#F5F9F6;line-height:1.5;font-size:17px;max-width:900px;margin:0 auto}
.rep .cover{background:#053030;color:#D6EDE3;padding:40px 36px 34px;border-bottom:6px solid #319A65}
.rep .cover .m{font-family:Oswald,'Arial Narrow',Arial,sans-serif;letter-spacing:3px;color:#319A65;font-size:14px}
.rep .cover h1{font-family:Oswald,'Arial Narrow',Arial,sans-serif;color:#fff;font-size:44px;line-height:1.05;margin:10px 0 10px}
.rep .cover p{margin:0}.rep .cover .d{margin-top:6px;font-size:15px}
.rep section{padding:22px 36px 4px}
.rep h2{font-family:Oswald,'Arial Narrow',Arial,sans-serif;color:var(--ink);font-weight:600;font-size:26px;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--body)}
.rep .note{font-size:19px;color:var(--ink)}
.rep dl{display:grid;grid-template-columns:190px 1fr;margin:0}.rep dt,.rep dd{margin:0;padding:8px 0;border-bottom:1px solid var(--line)}.rep dt{font-weight:700;color:var(--ink)}
.rep .tw{overflow-x:auto}.rep table{border-collapse:collapse;width:100%;min-width:560px;font-size:16px}

<body>
<div class="wrap">
  <header class="top">
    <div class="mark"><svg viewBox="0 0 30 16" aria-hidden="true"><path d="M0 16 L10 3 L16 10 L20 6 L30 16 Z" fill="#319A65"/></svg>Summit <span class="sub">Project Builder</span></div>
    <div class="tools" id="tools"></div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- catalogue ---------- */
const PATHS=[
 {k:"doc",t:"I’ve got a requirements doc",d:"Paste or upload it. We’ll pull out what’s in it."},
 {k:"built",t:"Something’s partly built",d:"Share notes on what exists and what’s next."},
 {k:"idea",t:"I just have an idea",d:"Start with a sentence. We’ll help with the rest."},
 {k:"replace",t:"We’re replacing a system",d:"Pick what you use today. We’ll build the list from it."}];
const EXAMPLES=["A portal where our franchisees order stock and see their sales","An app for field technicians to log jobs, photos and sign-offs","A dashboard that pulls sales data from three systems into one view","A customer onboarding flow with document upload and approvals"];
const ROLES=["Customers","Staff","Managers","Admins","Partners or suppliers","Field teams","Executives"];
const FEATURES=[
 {k:"accounts",t:"Accounts and sign-in",d:"People create an account, sign in and manage their details.",r:"People can create an account, sign in securely and manage their own details.",kw:/login|log in|sign in|account|portal|member/},
 {k:"dashboard",t:"Dashboards and reporting",d:"The numbers people check every week, in one place.",r:"Dashboards show the key numbers, with filters and the option to export.",kw:/dashboard|report|kpi|metric|sales|numbers|performance|analytics/},
 {k:"forms",t:"Forms and data capture",d:"Collect information without paper or spreadsheets.",r:"People capture information through forms with validation, so data arrives clean.",kw:/form|capture|survey|application|onboard|log jobs|intake/},
 {k:"workflow",t:"Workflows and approvals",d:"Work moves between people, with sign-off at the right points.",r:"Work moves through defined stages, with approvals and a clear record of who did what.",kw:/approv|workflow|sign-off|sign off|review|onboard/},
 {k:"notify",t:"Notifications",d:"Email, text or in-app alerts when something needs attention.",r:"People get email or in-app notifications when something needs their attention.",kw:/notif|alert|remind|email/},
 {k:"search",t:"Search and filtering",d:"Find any record quickly.",r:"People can search and filter records quickly, even as the data grows.",kw:/search|find|catalog|catalogue|lookup|directory/},
 {k:"content",t:"Content you can edit",d:"Change pages and copy without a developer.",r:"Admins can edit pages and content without a developer.",kw:/content|page|blog|cms|website|knowledge/},
 {k:"files",t:"Files and documents",d:"Upload, store and share documents.",r:"People can upload, store and share files, with sensible size and type limits.",kw:/file|document|upload|photo|pdf|contract/},
 {k:"payments",t:"Payments and billing",d:"Take payments, send invoices, manage subscriptions.",r:"The platform takes payments and issues receipts or invoices through a payment provider.",kw:/pay|invoice|billing|subscription|checkout|order/},
 {k:"booking",t:"Booking and scheduling",d:"Appointments, slots or resources.",r:"People can book time slots or resources, with availability shown in real time.",kw:/book|schedul|appointment|slot|calendar|rota/},
 {k:"messaging",t:"Messaging",d:"Conversations between users or with your team.",r:"Users can message each other or the team inside the platform.",kw:/chat|message|messaging|support/},
 {k:"ai",t:"AI assistant",d:"Answers questions, drafts text or sorts information.",r:"An AI assistant answers questions, drafts text or sorts information, with a person able to check its work.",kw:/\bai\b|assistant|chatbot|automat|smart/},
 {k:"import",t:"Import and export",d:"Bring data in from spreadsheets and get it back out.",r:"Data can be imported from spreadsheets and exported in common formats.",kw:/import|export|spreadsheet|csv|excel|three systems|pulls/},
 {k:"mobile",t:"Works well on phones",d:"Designed for people on the move.",r:"Everything works well on phones, not just on desktop.",kw:/mobile|phone|app\b|field|on the go|technician|driver/},
 {k:"portal",t:"Public site or portal",d:"A front door for customers or partners.",r:"A public-facing site or portal gives customers or partners their own front door.",kw:/portal|customer-facing|public|website|franchisee|partner/}];
const INTEGRATIONS=["CRM (Salesforce, HubSpot)","Finance or ERP","Email and calendar","Payment provider","Data warehouse","Single sign-on provider","Spreadsheets","Slack or Teams","Existing database","E-commerce platform"];
const COMPLIANCE=["GDPR","PIPEDA","SOC 2","HIPAA","PCI DSS","Accessibility (WCAG 2.2 AA)"];
const HANDOVER=[{k:"docs",t:"Documentation"},{k:"train",t:"Training for our team"},{k:"repos",t:"Code in our own repositories"},{k:"cloud",t:"Hosted in our cloud account"},{k:"support",t:"Support period after launch"}];
const HAND_R={docs:"Clear documentation: how it’s built, how to run it and how to fix common problems.",train:"Hands-on training for the people who’ll run and extend it.",repos:"All code lives in your own repositories from day one.",cloud:"It runs in your own cloud account, with access you control.",support:"A support period after launch, with agreed response times."};
const RUN=[{k:"summit",t:"Summit runs it for us",d:"We host, monitor and support it."},{k:"team",t:"Our team takes it over",d:"Built for handover from day one."},{k:"mix",t:"A mix",d:"Your team runs it with Summit on call."},{k:"unsure",t:"Not sure yet",d:"We’ll work it out together."}];
const CAPS={
 contacts:["Contacts and companies","Keep one record for every contact and company, with history and notes."],
 pipeline:["Deals and pipeline","Track deals through stages, with values, owners and expected close dates."],
 quotes:["Quotes and proposals","Create quotes from a product list and send them for approval or signature."],
 emailtrack:["Email and meeting logging","Log emails and meetings against the right contact automatically."],
 campaigns:["Marketing emails","Send marketing emails to segments and see who opened and clicked."],
 forecast:["Forecasting","Forecast revenue by period, owner and stage."],
 reports:["Reports and dashboards","Build reports and dashboards on any record, with filters and exports."],
 tasks:["Tasks and reminders","Assign tasks with due dates and reminders."],
 projects:["Projects and boards","Plan work as projects, boards or lists, with owners and due dates."],
 timeline:["Timelines and dependencies","Show work on a timeline, with dependencies between tasks."],
 automations:["Automations","Simple rules that move work on or tell people when something changes."],
 forms:["Forms","Collect requests or data through forms that create records automatically."],
 tickets:["Tickets","Log, assign and track customer issues from email, web and chat."],
 sla:["Service levels","Track response and resolution times against agreed targets."],
 kb:["Help centre","Publish help articles customers can search."],
 chat:["Live chat","Talk to customers in real time from the website or app."],
 inventory:["Stock and inventory","Track stock across locations, with reorder alerts."],
 orders:["Orders","Take and manage orders from creation to delivery."],
 purchasing:["Purchasing","Raise purchase orders and match them to supplier invoices."],
 invoicing:["Invoicing","Create and send invoices, and track what’s been paid."],
 ledger:["Accounts and ledger","Keep the books, with bank reconciliation and sales tax or VAT."],
 expenses:["Expenses","Submit and approve expenses with receipts."],
 catalogue:["Product catalogue","Manage products, variants, prices and images."],
 checkout:["Checkout and payments","Let customers pay online by card and digital wallet."],
 promos:["Discounts and promotions","Run discount codes and promotions with clear rules."],
 people:["Employee records","Keep employee records, roles and documents in one place."],
 leave:["Holiday and absence","Request and approve time off, with balances."],
 onboarding:["Onboarding","Run new starter checklists across teams."],
 reviews:["Performance reviews","Run review cycles with goals and feedback."],
 scheduling:["Scheduling","Book appointments or jobs against real availability."],
 dispatch:["Job dispatch","Assign jobs to field staff and track them through to completion."],
 mobilejobs:["Mobile job sheets","Field staff see jobs, capture photos and get sign-off on a phone."],
 docs:["Documents and sharing","Store, share and version documents, with permissions."],
 lists:["Custom tables","Hold your own records in tables people can sort, filter and edit."],
 approvals:["Approvals","Route items for approval, with a record of who approved what."],
 portal:["Customer portal","Customers sign in to see their own records and requests."],
 issues:["Issues and sprints","Track work as issues, planned into sprints with estimates."],
 roadmap:["Roadmaps","Share a roadmap of upcoming work."],
 shared:["Working together","Several people work on the same data without overwriting each other."],
 formulas:["Calculations","Calculations and rules that update automatically as data changes."]};
const SYSTEMS=[
 {c:"CRM and sales",roles:["Staff","Managers"],list:{"Salesforce":["contacts","pipeline","quotes","emailtrack","forecast","reports","tasks","automations","portal"],"HubSpot":["contacts","pipeline","emailtrack","campaigns","forms","reports","tasks","automations","tickets"],"Microsoft Dynamics 365":["contacts","pipeline","quotes","forecast","reports","tasks","automations","approvals"],"Pipedrive":["contacts","pipeline","emailtrack","reports","tasks","automations"],"Zoho CRM":["contacts","pipeline","quotes","campaigns","reports","tasks","automations"]}},
 {c:"Work management",roles:["Staff","Managers"],list:{"Monday.com":["projects","timeline","automations","forms","reports","approvals","shared"],"Asana":["projects","timeline","tasks","forms","automations","reports"],"Jira":["issues","roadmap","automations","reports","approvals"],"Smartsheet":["projects","timeline","lists","forms","automations","approvals","reports"],"Trello":["projects","tasks","automations"]}},
 {c:"Spreadsheets and databases",roles:["Staff"],list:{"Excel":["lists","formulas","shared","reports"],"Google Sheets":["lists","formulas","shared","reports","forms"],"Microsoft Access":["lists","forms","reports","formulas"],"Airtable":["lists","forms","automations","reports","approvals"],"SharePoint":["docs","lists","approvals","forms"]}},
 {c:"Finance and ERP",roles:["Staff","Managers"],list:{"QuickBooks":["invoicing","ledger","expenses","reports","purchasing"],"Xero":["invoicing","ledger","expenses","reports","purchasing"],"Sage":["invoicing","ledger","purchasing","reports","inventory"],"NetSuite":["ledger","invoicing","purchasing","inventory","orders","reports","approvals"],"SAP Business One":["ledger","invoicing","purchasing","inventory","orders","reports"]}},
 {c:"Customer service",roles:["Customers","Staff"],list:{"Zendesk":["tickets","sla","kb","chat","reports","automations","portal"],"Freshdesk":["tickets","sla","kb","chat","reports","automations"],"ServiceNow":["tickets","sla","approvals","kb","reports","automations","portal"],"Intercom":["chat","tickets","kb","campaigns","automations"]}},
 {c:"E-commerce",roles:["Customers","Admins"],list:{"Shopify":["catalogue","checkout","orders","inventory","promos","reports"],"WooCommerce":["catalogue","checkout","orders","promos"],"Adobe Commerce":["catalogue","checkout","orders","inventory","promos","portal","reports"]}},
 {c:"HR and people",roles:["Staff","Managers"],list:{"BambooHR":["people","leave","onboarding","reviews","reports"],"Workday":["people","leave","onboarding","reviews","approvals","reports"]}},
 {c:"Field service and booking",roles:["Field teams","Customers"],list:{"ServiceTitan":["scheduling","dispatch","mobilejobs","quotes","invoicing","reports"],"Jobber":["scheduling","dispatch","mobilejobs","quotes","invoicing"],"Calendly":["scheduling","forms","automations"]}}];
const REASONS={"Too expensive":"Costs less to run than our current SYS licences.","Too complicated for what we need":"Simpler than SYS: everyday tasks take fewer clicks, and new users can work it out on day one.","Doesn’t fit how we work":"Built around our own process, not a generic one.","Doesn’t connect to our other systems":"Connects to our other systems, so nothing is keyed in twice.","Reporting is weak":"Reports show the numbers we actually manage by, without exporting to spreadsheets.","Too slow":"Everyday screens load in under two seconds.","Contract ending":"Live before our SYS contract ends.","We want to own it":"We own the code and the data."};
const GENERIC_CAPS=["lists","forms","reports","approvals","automations","docs"];
const KINDS=["Automate a step","Summarise or draft","Sort and route","Predict","Answer questions","Spot problems"];
const SIZES=["Quick win","Moderate","Bigger build"];
const STEPS=["Your business","The goal","What it does","Rules and running it","Make it smarter","Submit"];
const PRI=["Must","Should","Could"], PRI_LABEL={Must:"Must have",Should:"Should have",Could:"Could have"};
const SRC_LABEL={doc:"From your document",user:"Added by you",suggested:"Suggested for you"};

/* ---------- state ---------- */
const KEY="summit-project-builder-v2";
const blank=()=>({step:0,view:"steps",path:"",source:"",idea:"",name:"",problem:"",audience:"",success:"",signoff:"",timing:"No fixed date",budget:"Not set yet",
 roles:[],features:{},custom:[],integrations:[],intOther:"",sso:false,perms:false,audit:false,personal:false,residency:"No preference",compliance:[],scale:"",uptime:"",
 run:"",skills:"",handover:[],featSrc:{},intSrc:{},ideas:[],ideaPick:{},ideasKey:"",smartRuns:0,ideaSeq:0,notes:{},
 rep:{cat:"",sys:"",other:"",caps:{},extra:{},reasons:[],migrate:true,parallel:false},
 biz:{website:"",type:"",notes:"",profile:null,researchedFor:"",failedFor:"",err:""},
 contact:{name:"",email:"",company:"",website:"",marketing:false},saved:false,savedAt:0,submitted:false,submittedAt:0});
let S=blank();
try{const raw=localStorage.getItem(KEY); if(raw){S=Object.assign(blank(),JSON.parse(raw)); S.rep=Object.assign(blank().rep,S.rep||{}); S.biz=Object.assign(blank().biz,S.biz||{}); if(!(S.step>=0&&S.step<STEPS.length))S.step=0;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let sample=null, downloads=null, busy=false, undo=null, modalOpen=false, contactErr="";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toggle=(a,v)=>a.includes(v)?a.filter(x=>x!==v):a.concat(v);
const nextPri=p=>p==="Must"?"Should":p==="Should"?"Could":p==="Could"?"":"Must";
const projectName=()=>S.name.trim()||(S.idea.trim()?S.idea.trim().slice(0,60):"Untitled project");
const shorten=t=>t.length>90?t.slice(0,87).replace(/\s+\S*$/,"")+"…":t;
const otherInts=()=>S.intOther.split(",").map(s=>s.trim()).filter(Boolean);
const listText=arr=>{const a=arr.slice();return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" and "+a.slice(-1);};
const hhmm=t=>new Date(t).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
const words=()=>[S.name,S.idea,S.problem,S.audience,S.success,S.source.slice(0,8000),S.custom.map(c=>c.text).join(" ")].join(" ").toLowerCase();
const hasContext=()=>!!(S.idea.trim()||S.source.trim()||S.problem.trim()||S.name.trim());

/* ---------- requirements ---------- */
function buildReqs(){
 const out=[];
 FEATURES.forEach(f=>{if(S.features[f.k])out.push({text:f.r,cat:"Feature",pri:S.features[f.k],src:S.featSrc[f.k]||"you",ref:{t:"feat",k:f.k}});});
 S.custom.forEach((c,i)=>out.push({text:c.text,cat:c.cat||"Feature",pri:c.pri||"Should",built:!!c.built,src:c.src==="doc"?"doc":c.src==="replace"?"system":c.src==="suggested"?"suggested":"you",ref:{t:"custom",i}}));
 S.ideas.forEach(i=>{const p=S.ideaPick[i.id];if(p&&p!=="no")out.push({text:i.what,cat:"AI idea",pri:p,src:"ai",ref:{t:"idea",id:i.id}});});
 S.integrations.forEach(i=>out.push({text:`Connects to ${i}.`,cat:"Integration",pri:"Must",src:S.intSrc[i]||"you",ref:{t:"int",v:i}}));
 otherInts().forEach(i=>out.push({text:`Connects to ${i}.`,cat:"Integration",pri:"Must",src:"you",ref:{t:"step",i:2}}));
 const g=(text,pri)=>out.push({text,cat:"Guardrail",pri,src:"you",ref:{t:"step",i:3}});
 if(S.sso)g("People sign in with single sign-on.","Must");
 if(S.perms)g("Access is controlled by role.","Must");
 if(S.audit)g("Important changes are logged with who and when.","Should");
 if(S.personal)g("Personal data is protected and can be deleted on request.","Must");
 S.compliance.forEach(c=>g(`Meets ${c}.`,"Must"));
 S.handover.forEach(h=>out.push({text:HAND_R[h],cat:"Running it",pri:"Should",src:"you",ref:{t:"step",i:3}}));
 return out;
}
const counts=r=>({Must:r.filter(x=>x.pri==="Must").length,Should:r.filter(x=>x.pri==="Should").length,Could:r.filter(x=>x.pri==="Could").length});
function essentials(){
 const c=counts(buildReqs());
 return [["What problem you’re solving",!!S.problem.trim(),1],["How you’ll know it worked",!!S.success.trim(),1],["Who signs off the scope",!!S.signoff.trim(),1],
  ["At least one type of user",S.roles.length>0,1],["At least one must have",c.Must>0,2],["Who runs it after launch",!!S.run,3]];
}
function completeness(){const e=essentials();const extra=[!!S.path,!!S.audience.trim(),!!S.scale,S.ideas.some(i=>S.ideaPick[i.id])];const all=e.map(x=>x[1]).concat(extra);return Math.round(all.filter(Boolean).length/all.length*100);}

/* ---------- assist strip ---------- */
function assist(step,text,label){
 const u=undo&&undo.step===step?`<button type="button" class="btn alt small" data-act="undo">Undo</button>`:"";
 return `<div class="assist"><p>${text}</p><div class="acts"><button type="button" class="btn small" data-act="suggest" data-i="${step}" ${busy?"disabled":""}><span class="spark" aria-hidden="true">✦</span>${label}</button>${u}</div></div>

function repBuild(){

 S.custom=S.custom.filter(c=>c.src!=="replace");
 picked.forEach(c=>S.custom.push({text:c.r,pri:R.caps[c.k],cat:"Feature",src:"replace"}));
 R.reasons.forEach(r=>S.custom.push({text:REASONS[r].replace(/SYS/g,sys),pri:(r==="Too slow"||r==="Too complicated for what we need")?"Should":"Must",cat:"Feature",src:"replace"}));
 if(R.migrate)S.custom.push({text:`Existing data from ${sys}, including history and attachments, is moved across and checked before the switch-over.`,pri:"Must",cat:"Running it",src:"replace"});
 if(R.parallel)S.custom.push({text:`${sys} and the new tool can run side by side during the switch-over, with data kept in step.`,pri:"Should",cat:"Running it",src:"replace"});
 if(!S.name.trim())S.name=`${sys} replacement`;
 if(!S.idea.trim())S.idea=`Replace ${sys} with something built around how we work`;
 if(!S.problem.trim()){
  const uses=listText(picked.slice(0,4).map(c=>c.t.toLowerCase()));

 }
 const cat=SYSTEMS.find(x=>x.list[sys]); (cat?cat.roles:["Staff"]).concat("Admins").forEach(r=>{if(!S.roles.includes(r))S.roles.push(r);});
 const n=S.custom.filter(c=>c.src==="replace").length;

 const first=(S.contact.name||"").trim().split(/\s+/)[0];
 const r=buildReqs(), c=counts(r);
 return `<div class="done"><h2>Thanks${first?", "+esc(first):""}. Your brief is with Summit.</h2>
 <p class="big">Anthony will read it, shape it into a project brief and send it to you within two working days. If anything needs clarifying, he’ll be in touch first.</p>
 <dl class="sum" style="margin-top:26px"><dt>Project</dt><dd>${esc(projectName())}</dd><dt>Submitted</dt><dd>${new Date(S.submittedAt).toLocaleString("en-GB",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}</dd>
 <dt>Status</dt><dd>Submitted</dd><dt>What you sent</dt><dd>${r.length} requirements (${c.Must} must have), ${S.roles.length} user types</dd></dl>

/* ---------- blueprint ---------- */
const SRC={you:{f:"#319A65",s:"#319A65",l:"Added by you"},doc:{f:"#D6EDE3",s:"#D6EDE3",l:"From your document"},system:{f:"#4A8E8E",s:"#4A8E8E",l:"From your current system"},suggested:{f:"none",s:"#D6EDE3",l:"Suggested for you"},ai:{f:"#FFFFFF",s:"#FFFFFF",l:"AI idea"}};
const STEP_OF={Guardrail:6,"Running it":7,Integration:4};
let selKey=null, dockOpen=false, lastCount=null;
const rkey=x=>x.cat+"|"+x.text;
function detail(reqs){
 const it=reqs.find(x=>rkey(x)===selKey); if(!it){selKey=null;return "";}
 const i=reqs.indexOf(it), ed=it.ref&&["feat","custom","idea"].includes(it.ref.t), rm=it.ref&&["feat","custom","idea","int"].includes(it.ref.t);
 const stepI=it.ref&&it.ref.t==="step"?it.ref.i:null;
 return `<div class="dt" role="dialog" aria-label="Requirement"><p class="dt-t">${esc(it.text)}</p>
  <p class="dt-m"><span class="dot" style="background:${SRC[it.src].f==="none"?"transparent":SRC[it.src].f};border-color:${SRC[it.src].s}"></span>${SRC[it.src].l} · ${esc(it.cat)}</p>
  ${ed?`<div class="dt-p">${PRI.map(p=>`<button type="button" data-act="blkpri" data-i="${i}" data-v="${p}" aria-pressed="${it.pri===p}">${PRI_LABEL[p]}</button>`).join("")}</div>`:`<p class="dt-m">${PRI_LABEL[it.pri]}</p>`}
  <div class="dt-a">${rm?`<button type="button" class="ghost" data-act="blkrem" data-i="${i}">Remove</button>`:""}${stepI!==null?`<button type="button" class="ghost" data-act="goto" data-i="${stepI}">Change on ${STEPS[stepI]}</button>`:""}<button type="button" class="ghost" data-act="blkclose">Close</button></div></div>`;
}
function fullList(reqs){
 return `<div class="fl">${PRI.map(p=>{const xs=reqs.filter(x=>x.pri===p);if(!xs.length)return "";return `<div class="k" style="margin-top:12px">${PRI_LABEL[p]} (${xs.length})</div><ul>${xs.map(x=>`<li><button type="button" class="fl-i${selKey===rkey(x)?" sel":""}" data-act="blk" data-i="${reqs.indexOf(x)}"><span class="dot" style="background:${SRC[x.src].f==="none"?"transparent":SRC[x.src].f};border-color:${SRC[x.src].s}"></span>${esc(shorten(x.text))}</button></li>`).join("")}</ul>`;}).join("")}</div>`;
}
function refAct(it,fn){
 const r=it.ref; if(!r)return;
 if(r.t==="feat")fn.feat&&fn.feat(r.k);
 if(r.t==="custom")fn.custom&&fn.custom(r.i);
 if(r.t==="idea")fn.idea&&fn.idea(r.id);
 if(r.t==="int")fn.int&&fn.int(r.v);
}
function paintBlueprint(){
 const r=buildReqs(),c=counts(r),pct=completeness(),miss=essentials().filter(x=>!x[1]).length;
 const present=Object.keys(SRC).filter(k=>r.some(x=>x.src===k));
 const dock=$("#dock"); if(!dock)return;
 dock.hidden=!!S.submitted;
 const dc=x=>`background:${SRC[x.src].f==="none"?"transparent":SRC[x.src].f};border-color:${SRC[x.src].s}`;
 const bar=$("#dockbar");
 bar.setAttribute("aria-expanded",String(dockOpen));
 bar.innerHTML=`<span class="k">Your blueprint</span><span class="mdots" aria-hidden="true">${r.slice(-24).map(x=>`<i style="${dc(x)}"></i>`).join("")}</span>
  <span class="dsum"><b>${r.length}</b> requirement${r.length===1?"":"s"} · ${c.Must} must have</span><span class="pc">${pct}% ready</span><span class="mv">${dockOpen?"Close ▾":"Open ▴"}</span>`;
 if(lastCount!==null&&r.length>lastCount){dock.classList.remove("bump");void dock.offsetWidth;dock.classList.add("bump");}
 lastCount=r.length;
 const bp=$("#bp"); bp.hidden=!dockOpen; if(!dockOpen)return;
 bp.innerHTML=`<div class="dock-grid"><div>
  <h3>${esc(projectName())}</h3>
  <div class="row"><span>Ready to submit</span><span>${pct}%</span></div>
  <div class="meter" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="How complete your brief is"><i style="width:${pct}%"></i></div>
  <div class="tally"><span><b>${c.Must}</b> must</span><span><b>${c.Should}</b> should</span><span><b>${c.Could}</b> could</span></div>
  ${present.length?`<div class="lg">${present.map(k=>`<span><span class="dot" style="background:${SRC[k].f==="none"?"transparent":SRC[k].f};border-color:${SRC[k].s}"></span>${SRC[k].l}</span>`).join("")}</div>`:""}
  ${S.biz.notes.trim()?`<div class="dbiz"><div class="k">About your business</div><p>${esc(shorten(S.biz.notes.trim()))}</p><button type="button" class="ghost" data-act="goto" data-i="0">Edit</button></div>`:""}
  ${detail(r)}
  ${S.step>0&&miss?`<div class="gapline">${miss} essential${miss>1?"s":""} still to answer before you submit.</div>`:""}
 </div><div>${r.length?`<p class="hintline" style="margin-top:0">Tap any requirement to change its priority or remove it.</p>${fullList(r)}`:`<p class="fl none">Nothing yet. Every answer you give adds to this list.</p>`}</div></div>`;
}

/* ---------- render ---------- */
function renderTools(){
 const st=isOwnerX?`<a class="ghost" href="#studio">Studio</a>`:"";
 $("#tools").innerHTML=S.submitted?st:`${st}<button type="button" class="btn small ${S.saved?"alt":""}" data-act="openSave">${S.saved?"Saved "+hhmm(S.savedAt):"Save"}</button><button class="ghost" data-act="reset" type="button">Start again</button>`;
}
function renderRail(){
 const n=STEPS.length, last=S.step===n-1;
 $("#rail").innerHTML=`<button type="button" class="arrow ${S.step===0?"hide":""}" data-act="prev" ${S.step===0?'tabindex="-1" aria-hidden="true"':`aria-label="Back to ${STEPS[S.step-1]}"`}><span aria-hidden="true">←</span><span class="t">Back</span></button>
 <ol class="steps" style="--p:${(S.step/(n-1)).toFixed(3)}">${STEPS.map((t,i)=>`<li><button type="button" data-act="goto" data-i="${i}" class="${i<S.step?"done":""}" ${S.step===i?'aria-current="step"':""} aria-label="Step ${i+1}: ${t}"><span class="d" aria-hidden="true">${i+1}</span><span class="lbl" aria-hidden="true">${t}</span></button></li>`).join("")}</ol>
 <button type="button" class="arrow next ${last?"hide":""}" data-act="next" ${last?'tabindex="-1" aria-hidden="true"':`aria-label="Next: ${STEPS[S.step+1]}"`}><span class="t">Next</span><span aria-hidden="true">→</span></button>
 <p class="now">Step ${S.step+1} of ${n}: ${STEPS[S.step]}</p>`;
}
function render(focusId){
 if(inStudio()){renderStudio();return;}
 renderTools();
 if(S.submitted){ $("#hero").hidden=true; $("#grid").innerHTML=vDone(); const dk=$("#dock"); if(dk) dk.hidden=true; renderModal(); return; }
 if(!$("#rail")){ location.reload(); return; }
 renderRail();
 $("#hero").hidden=S.step>0;
 $("#stage").innerHTML=VIEWS[S.step]();
 paintBlueprint();
 const f=$("#f-file"); if(f) f.addEventListener("change",onFile);
 renderModal();
 if(focusId){const el=document.getElementById(focusId); if(el) el.focus({preventScroll:true});}
}
function go(fn){ const from=S.step; fn(); if(S.saved) S.savedAt=Date.now(); save(); render(); window.scrollTo({top:0});
 if(from===0&&S.step!==0&&!researchBusy&&readyToResearch()) scheduleResearch(0); }

/* ---------- save modal ---------- */
function renderModal(){
 if(!modalOpen){$("#modal").innerHTML="";return;}
 $("#modal").innerHTML=`<div class="modal" data-act="closeModal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="save-title">
  <h2 id="save-title">${S.saved?"Your details":"Save your progress"}</h2>
  <p style="margin:0 0 18px">${S.saved?"Update anything that’s changed.":"We’ll save your brief and email you a link, so you can pick it up on any device."}</p>
  ${contactFields()}
  <div style="display:flex;gap:10px;justify-content:flex-end"><button type="button" class="btn alt" data-act="closeModal">Cancel</button><button type="button" class="btn" data-act="doSave">Save</button></div></div></div>`;
}
function normSite(v){return v.trim().toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").split(/[\/?#]/)[0];}
function checkContact(){
 const c=S.contact;
 if(!c.name.trim()||!c.email.trim()||!c.company.trim()||!c.website.trim()) return "Please fill in all four details.";
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.email.trim())) return "That email address doesn’t look right.";
 const site=normSite(c.website); if(!/\.[a-z]{2,}$/.test(site)) return "That website doesn’t look right. Try something like acme.com.";
 c.website=site; return "";
}
function freeEmail(){return /@(gmail|googlemail|hotmail|outlook|yahoo|icloud|live|aol|proton)\./i.test(S.contact.email);}

/* ---------- events ---------- */
document.addEventListener("input",e=>{
 const d=e.target.dataset||{};
 if(d.f){S[d.f]=e.target.value; save(); paintBlueprint();}
 if(d.c){S.contact[d.c]=e.target.type==="checkbox"?e.target.checked:e.target.value; save();}
 if(d.b){S.biz[d.b]=e.target.value; save(); scheduleResearch();}
 if(d.p&&S.biz.profile){S.biz.profile[d.p]=e.target.value; save();}
});
document.addEventListener("change",e=>{const d=e.target.dataset||{}; if(d.f&&e.target.tagName==="SELECT"){S[d.f]=e.target.value;save();paintBlueprint();} if(d.b==="website"){S.biz.website=e.target.value; save(); scheduleResearch(0);}});
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&modalOpen){modalOpen=false;contactErr="";renderModal();return;}
 if(e.key==="Escape"&&dockOpen){dockOpen=false;paintBlueprint();$("#dockbar").focus();return;}
 if(e.key!=="Enter")return;
 if(e.target.id==="f-role"){e.preventDefault();act("addRole");}
 if(e.target.id==="f-req"){e.preventDefault();act("addReq");}
 if(e.target.id==="r-other"){e.preventDefault();act("repother");}
});
document.addEventListener("click",e=>{
 const b=e.target.closest("[data-act]"); if(!b)return;
 if(b.classList.contains("modal")&&e.target!==b)return;
 act(b.dataset.act,b.dataset.v,b.dataset.i,b.id,b.dataset.f);
});
function act(a,v,i,id,f){
 switch(a){
  case "path": S.path=v; break;
  case "starter": {
   const el=document.querySelector(`[data-f="${f}"]`); if(!el)return;
   S[f]=v; el.value=v; save(); paintBlueprint(); el.focus(); const k=v.indexOf("___"); if(k>=0&&el.setSelectionRange) el.setSelectionRange(k,k+3); return; }
  case "role": S.roles=toggle(S.roles,v); break;
  case "addRole": {const el=$("#f-role");const t=el.value.trim(); if(t&&!S.roles.includes(t))S.roles.push(t); save(); render("f-role"); return;}
  case "feat": {const was=S.features[v]; const p=nextPri(was||""); if(p){S.features[v]=p; if(!was)S.featSrc[v]="you";} else {delete S.features[v]; delete S.featSrc[v];} break;}
  case "addReq": {const t=$("#f-req").value.trim(); if(t)S.custom.push({text:t,pri:$("#f-reqp").value,cat:"Feature",src:"user"}); save(); render("f-req"); return;}
  case "cpri": {const c=S.custom[+i]; c.pri=c.pri==="Must"?"Should":c.pri==="Should"?"Could":"Must"; break;}
  case "crem": S.custom.splice(+i,1); save(); render(); return;
  case "int": S.integrations=toggle(S.integrations,v); break;
  case "flag": S[v]=!S[v]; break;
  case "comp": S.compliance=toggle(S.compliance,v); break;
  case "run": S.run=v; break;
  case "hand": S.handover=toggle(S.handover,v); break;
  case "pick": S.ideaPick[i]=S.ideaPick[i]===v?"":v; break;
  case "dev": devAnswer(v); return;
  case "blk": {const it=buildReqs()[+i]; if(!it)return; const k=rkey(it); selKey=selKey===k?null:k; paintBlueprint(); return;}
  case "blkclose": selKey=null; paintBlueprint(); return;
  case "blkpri": {const it=buildReqs()[+i]; if(!it)return; refAct(it,{feat:k=>{S.features[k]=v;},custom:j=>{S.custom[j].pri=v;},idea:id=>{S.ideaPick[id]=v;}}); selKey=it.cat+"|"+it.text; save(); render(); return;}
  case "blkrem": {const it=buildReqs()[+i]; if(!it)return; refAct(it,{feat:k=>{delete S.features[k];delete S.featSrc[k];},custom:j=>{S.custom.splice(j,1);},idea:id=>{S.ideaPick[id]="no";},int:x=>{S.integrations=S.integrations.filter(y=>y!==x);}}); selKey=null; save(); render(); return;}
  case "dock": dockOpen=!dockOpen; paintBlueprint(); return;
  case "repcat": S.rep.cat=v; break;
  case "repsys": S.rep.sys=v; S.rep.other=""; S.rep.caps={}; S.rep.extra={}; S.notes.rep=""; break;
  case "repcap": {const p=nextPri(S.rep.caps[v]||""); if(p)S.rep.caps[v]=p; else delete S.rep.caps[v]; break;}
  case "repusual": sysCaps().forEach((c,n)=>{S.rep.caps[c.k]=n<3?"Must":n<5?"Should":"Could";}); break;
  case "repwhy": S.rep.reasons=toggle(S.rep.reasons,v); break;
  case "repflag": S.rep[v]=!S.rep[v]; break;
  case "repbuild": repBuild(); save(); render(); return;
  case "repother": repOther(); return;
  case "suggest": suggest(+i); return;
  case "undo": if(undo){const st=undo.step;S=Object.assign(blank(),JSON.parse(undo.snap));S.notes[st]="Undone.";undo=null;save();render();} return;
  case "refresh": runIdeas(true); return;
  case "read": readDoc(); return;
  case "goto": return go(()=>{S.step=+i;});
  case "next": return go(()=>{S.step=Math.min(S.step+1,STEPS.length-1);});
  case "prev": return go(()=>{S.step=Math.max(S.step-1,0);});
  case "openSave": if(!S.contact.website.trim()&&S.biz.website.trim())S.contact.website=normSite(S.biz.website); if(!S.contact.company.trim()&&S.biz.profile&&S.biz.profile.company)S.contact.company=S.biz.profile.company; modalOpen=true; contactErr=""; renderModal(); setTimeout(()=>{const el=$("#c-name");if(el)el.focus();},0); return;
  case "closeModal": modalOpen=false; contactErr=""; renderModal(); return;
  case "doSave": {
   contactErr=checkContact(); if(contactErr){renderModal();return;}
   const first=!S.saved; S.saved=true; S.savedAt=Date.now(); modalOpen=false; save(); render();
   toast(first?(freeEmail()?"Saved. A work email helps us match your company, if you have one.":"Saved. We’ll email you a link to come back to it."):"Details updated."); return; }
  case "submit": {
   if(!S.saved){contactErr=checkContact(); if(contactErr){render();const el=$(".err");if(el)el.scrollIntoView({block:"center"});return;} S.saved=true; S.savedAt=Date.now();}
   S.submitted=true; S.submittedAt=Date.now(); save(); render(); window.scrollTo({top:0}); submitRemote(); return; }
  case "reset": if(confirmReset()){S=blank();undo=null;save();location.reload();} return;
  default: return;
 }
 save(); render(id);
}
let armed=false,armT;
function confirmReset(){
 const b=[...document.querySelectorAll('[data-act="reset"]')].pop(); if(!b)return true;
 if(armed){armed=false;return true;}
 armed=true; b.textContent="Tap again to clear everything"; clearTimeout(armT); armT=setTimeout(()=>{armed=false;b.textContent=S.submitted?"Start a new brief":"Start again";},4000); return false;
}
async function onFile(e){
 const file=e.target.files&&e.target.files[0]; if(!file)return;
 if(!/\.(txt|md|markdown|csv)$/i.test(file.name)&&!/^text\//.test(file.type)){S.notes.read="That file type can’t be read here. Copy the text and paste it in.";render();return;}
 S.source=(S.source.trim()?S.source.trim()+"\n\n":"")+await file.text(); save(); render();
}

/* ---------- rule-based suggestions ---------- */
function ruleSuggest(step){
 const w=words(); let added=[];
 if(step===1){
  if(!S.problem.trim()&&S.idea.trim()){S.problem=`Today there’s no single place for this. We want ${S.idea.trim().charAt(0).toLowerCase()+S.idea.trim().slice(1)}.`;added.push("the problem");}
  if(!S.success.trim()){S.success="Cut the time spent on this by half within six months of launch";added.push("a success measure");}
  if(!S.signoff.trim()){S.signoff="Me";added.push("sign-off");}
  return added.length?`Drafted ${listText(added)} as a starting point. Edit the wording so it’s yours.`:"Everything here is filled in already.";
 }
 if(step===2){
  const map=[[/customer|client|consumer|buyer/,"Customers"],[/staff|team|employee|ops|office/,"Staff"],[/manager|approv|supervis/,"Managers"],[/supplier|partner|franchise|dealer|vendor/,"Partners or suppliers"],[/field|driver|technician|site|engineer/,"Field teams"],[/executive|board|leadership|ceo|director/,"Executives"]];
  map.forEach(([re,r])=>{if(re.test(w)&&!S.roles.includes(r)){S.roles.push(r);added.push(r);}});
  if(!S.roles.includes("Staff")&&!added.length){S.roles.push("Staff");added.push("Staff");}
  if(!S.roles.includes("Admins")){S.roles.push("Admins");added.push("Admins");}
  return added.length?`Added ${listText(added)}. Take off any that don’t fit.`:"Nothing new to add from what you’ve told us.";
 }
 if(step===3){
  FEATURES.forEach(f=>{if(!S.features[f.k]&&f.kw.test(w)){S.features[f.k]=added.length<4?"Must":"Should";S.featSrc[f.k]="suggested";added.push(f.t);}});
  if(!added.length&&!Object.keys(S.features).length){S.features.accounts="Must";S.features.dashboard="Should";S.features.notify="Could";["accounts","dashboard","notify"].forEach(k=>S.featSrc[k]="suggested");added.push("Accounts and sign-in","Dashboards and reporting","Notifications");}
  return added.length?`Added ${added.length} feature${added.length>1?"s":""}: ${listText(added)}. Tap any card to change its priority.`:"Nothing new to add. Your picks already cover what we can see.";
 }
 if(step===4){
  const add=x=>{if(!S.integrations.includes(x)){S.integrations.push(x);S.intSrc[x]="suggested";added.push(x);}};
  if(S.features.payments)add("Payment provider");
  if(/crm|salesforce|hubspot|lead|pipeline/.test(w))add("CRM (Salesforce, HubSpot)");
  if(/finance|invoice|erp|accounting|xero|quickbooks|sage/.test(w))add("Finance or ERP");
  if(S.features.notify||S.features.booking||/email|calendar/.test(w))add("Email and calendar");
  if(S.features.import||/spreadsheet|excel|csv/.test(w))add("Spreadsheets");
  if(/shop|ecommerce|e-commerce|shopify|store/.test(w))add("E-commerce platform");
  if(/slack|teams/.test(w))add("Slack or Teams");
  if(S.features.dashboard&&/three systems|several systems|data/.test(w))add("Data warehouse");
  if(S.roles.some(r=>["Staff","Managers","Executives","Field teams"].includes(r))&&S.features.accounts)add("Single sign-on provider");
  return added.length?`Added ${listText(added)}. Remove any you don’t use.`:"Nothing obvious to add. Name your own below if there’s something we’ve missed.";
 }
 if(step===6){
  const on=[]; const set=(k,t)=>{if(!S[k]){S[k]=true;on.push(t);}};
  const internal=S.roles.some(r=>["Staff","Managers","Executives","Field teams","Admins"].includes(r));
  if(S.roles.length>1)set("perms","roles and permissions");
  if(internal&&S.features.accounts&&S.roles.includes("Staff"))set("sso","single sign-on");
  if(S.features.workflow||S.features.payments)set("audit","an audit trail");
  if(S.features.accounts||S.features.forms||S.roles.includes("Customers"))set("personal","personal data");
  if(S.features.payments&&!S.compliance.includes("PCI DSS")){S.compliance.push("PCI DSS");on.push("PCI DSS");}
  if((S.features.portal||S.roles.includes("Customers"))&&!S.compliance.includes("Accessibility (WCAG 2.2 AA)")){S.compliance.push("Accessibility (WCAG 2.2 AA)");on.push("accessibility");}
  if(!S.uptime){S.uptime=(S.features.portal||S.roles.includes("Customers"))?"Around the clock":"Business hours";on.push("uptime: "+S.uptime.toLowerCase());}
  return on.length?`Switched on ${listText(on)}. Where data lives and how many users you’ll have are still yours to answer.`:"Nothing to add. You’ve covered the usual ones.";
 }
 return "";
}
function devAnswer(v){
 if(v==="yes"){S.run="team";S.handover=["docs","train","repos","cloud","support"];S.notes[7]="Set to your team taking it over, with a full handover. Add your team’s skills below if you know them.";}
 if(v==="some"){S.run="mix";S.handover=["docs","train","support"];S.notes[7]="Set to a mix: your team runs it with Summit on call.";}
 if(v==="no"){S.run="summit";S.handover=["support"];S.notes[7]="Set to Summit running it for you. You can change this any time.";}
 save(); render();
}

const HEAD="You are helping a business owner define a software project they want built. Base everything on what they have told you. British spelling. No em or en dashes. Plain language, no jargon. Reply with only JSON.";
/* ---------- business context and research ---------- */
let researchBusy=false;
const bizKey=()=>normSite(S.biz.website||"")+"|"+(S.biz.notes||"").trim();
function vBiz(){
 const B=S.biz, P=B.profile;
 return `<h2 style="margin-top:34px">Tell us about your business</h2><p class="lede">Add as much or as little as you like.</p><section class="biz">
 <div class="field"><label for="b-web">Company website</label><input type="text" id="b-web" data-b="website" value="${esc(B.website)}" placeholder="acme.com" autocomplete="url"></div>
 <div class="field"><label for="b-notes">Anything else we should know?</label><p class="hint">What you do, who your customers are, what’s frustrating today, what you’ve tried. Write it like you’d explain it to a colleague.</p>
 <textarea id="b-notes" data-b="notes">${esc(B.notes)}</textarea></div>
 </section>`;
}
function bizOut(){

function reportFile(R){return `<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(R.title)}: project brief</title><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Carlito:wght@400;700&display=swap" rel="stylesheet"><style>body{margin:0;background:#F5F9F6}${REPORT_CSS}</style></head><body><div class="rep">${reportBody(R)}</div></body></html>`;}

/* ---- studio views ---- */
function sv(){
 if(!isOwnerX) return `<div class="done"><h2>Summit only</h2><p class="big">The studio is only open to the owner of this page.</p><p><a href="#" data-act="leavestudio">Back to the builder</a></p></div>`;
 if(!studio.cur) return svList();
 return svReport();
}
function svList(){
 const L=studio.list;
 return `<div class="studio"><div class="sbar"><h2>Report studio</h2><button type="button" class="btn alt small" data-act="leavestudio">Back to the builder</button></div>
 <p class="lede">Every submitted brief. Open one to edit its draft report and send it.</p>
 ${L===null?`<div class="loading"><i></i>Loading briefs…</div>`:!L.length?`<p>No briefs submitted yet. Submit one from the builder to see it here.</p>`:
 `<div class="tablewrap"><table class="stbl"><thead><tr><th>Project</th><th>Company</th><th>Contact</th><th>Submitted</th><th>Status</th><th></th></tr></thead><tbody>${L.map(x=>`<tr><td><strong>${esc(x.project)}</strong></td><td>${esc(x.company)}</td><td>${esc(x.contact)}</td><td>${new Date(x.submittedAt).toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}</td><td><span class="tag">${esc(x.status)}</span></td><td><button type="button" class="btn small" data-act="sopen" data-v="${esc(x.id)}">Open</button></td></tr>`).join("")}</tbody></table></div>`}</div>`;
}
function svReport(){
 const R=studio.rep, ed=studio.mode==="edit";
 const tools=`<div class="sbar"><button type="button" class="btn alt small" data-act="sback">← All briefs</button>
  <div class="sacts"><button type="button" class="btn small ${ed?"":"alt"}" data-act="smode" data-v="edit">Edit</button><button type="button" class="btn small ${ed?"alt":""}" data-act="smode" data-v="preview">Preview</button>
  ${sample?`<button type="button" class="btn alt small" data-act="sreview" ${studio.busy?"disabled":""}><span class="spark" aria-hidden="true">✦</span>${R.summary?"Run AI review again":"Run AI review"}</button>`:""}
  ${downloads?`<button type="button" class="btn alt small" data-act="sdl">Download</button>`:""}
  ${mcpx?`<button type="button" class="btn alt small" data-act="sgdoc" ${studio.busy?"disabled":""}>${R.gdoc?"New Google Doc version":"Move to Google Doc"}</button>`:""}
  ${R.gdoc?`<a class="btn alt small" href="${esc(R.gdoc.url)}" target="_blank" rel="noopener">Open Google Doc</a>`:""}
  ${R.gdoc?`<button type="button" class="btn small" data-act="ssend">${R.status==="Shared"?"Shared "+new Date(R.sentAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):"Email the doc to the client"}</button>`:""}</div></div>
  <p class="status" role="status">${esc(studio.msg)}</p>`;
 if(!ed) return `<div class="studio">${tools}<div class="rep preview">${reportBody(R)}</div></div>`;
 const ta=(k,label,val,rows)=>`<div class="field"><label for="s-${k}">${label}</label><textarea id="s-${k}" data-s="${k}" style="min-height:${rows*26}px">${esc(val)}</textarea></div>`;
 const P=R.research;
 return `<div class="studio">${tools}
 <div class="sgrid"><div>
  <div class="field"><label for="s-title">Project name</label><input type="text" id="s-title" data-s="title" value="${esc(R.title)}"></div>
  ${ta("note","Your note at the top",R.note,3)}
  ${ta("summary","Summary"+(R.summary?"":" (run the AI review to draft one)"),R.summary,3)}
  <h3 class="subh" style="margin-top:20px">The brief</h3>
  ${R.brief.map((x,i)=>`<div class="field"><label for="s-b${i}">${esc(x[0])}</label><textarea id="s-b${i}" data-sb="${i}" style="min-height:52px">${esc(x[1])}</textarea></div>`).join("")}
  <h3 class="subh">Requirements</h3>
  <div class="reqed">${R.reqs.map((x,i)=>`<div class="rq"><span class="rid">${esc(x.id)}</span><textarea data-sr="${i}" aria-label="${esc(x.id)} text">${esc(x.text)}</textarea>
   <select data-srp="${i}" aria-label="${esc(x.id)} priority">${PRI.map(p=>`<option value="${p}" ${x.pri===p?"selected":""}>${PRI_LABEL[p]}</option>`).join("")}</select>
   <button type="button" class="ghost" data-act="srdel" data-i="${i}" aria-label="Remove ${esc(x.id)}">Remove</button>
   ${(R.acceptance[x.id]||[]).length?`<p class="acc">Acceptance: ${esc(R.acceptance[x.id].join(" · "))}</p>`:""}<span class="src">${esc(x.cat)} · ${esc(x.src)}</span></div>`).join("")}
  <button type="button" class="btn alt small" data-act="sradd">Add a requirement</button></div>
  <h3 class="subh">Suggested phasing</h3><p class="hint">Drawn from the priorities above.</p><div class="rep"><div class="dg" id="dg-road">${roadmapSVG(R)}</div></div>
  <h3 class="subh">How it fits</h3><div class="rep"><div class="dg" id="dg-fit">${fitSVG(R)}</div></div><p class="hint" style="margin-top:12px">The diagram is drawn from these. One per line, and it redraws as you type.</p>
  ${R.fit?`<div class="two">${ta("fitUsers","Who uses it",R.fit.users.join("\n"),3)}${ta("fitSystems","Connects to",R.fit.systems.join("\n"),3)}</div>
  <div class="two">${ta("fitFeatures","Shown in the tool box",R.fit.features.join("\n"),3)}<div class="field"><label for="s-fitReplaced">Being replaced</label><input type="text" id="s-fitReplaced" data-s="fitReplaced" value="${esc(R.fit.replaced)}"></div></div>`:""}
  <h3 class="subh">To settle before we quote</h3>
  ${ta("gaps","Gaps, one per line",R.gaps.join("\n"),4)}
  ${ta("questions","Questions for the client, one per line",R.questions.join("\n"),3)}
  ${ta("risks","Risks, one per line as risk: mitigation",R.risks.map(x=>x.risk+": "+x.mitigation).join("\n"),3)}
  ${ta("assumptions","Assumptions, one per line",R.assumptions.join("\n"),3)}
  ${ta("running","Running it",R.running,2)}
 </div>
 <aside class="sside"><div class="k">Only you see this</div>
  <p><strong>${esc(R.contact||"")}</strong>${R.company?", "+esc(R.company):""}<br>${esc(R.email||"")}${R.website?"<br>"+esc(R.website):""}</p>
  ${R.replacing?`<p><strong>Replacing:</strong> ${esc(R.replacing)}${R.reasons.length?" ("+esc(R.reasons.join(", ").toLowerCase())+")":""}</p>`:""}
  ${R.theirNotes?`<p><strong>In their words:</strong> ${esc(R.theirNotes)}</p>`:""}
  ${P?`<p><strong>Background research</strong> (unconfirmed):</p><ul>${[["What they do",P.whatTheyDo],["Customers",P.customers],["Size",P.size],["Systems",(P.systems||[]).join(", ")],["Challenges",(P.challenges||[]).join("; ")]].filter(x=>x[1]).map(x=>`<li>${esc(x[0])}: ${esc(x[1])}</li>`).join("")}</ul>${P.summary?`<p>${esc(P.summary)}</p>`:""}`:""}
  ${R.ideasPassed.length?`<p><strong>AI ideas they passed on:</strong> ${esc(R.ideasPassed.join("; "))}</p>`:""}
 </aside></div></div>`;
}
function renderStudio(){
 $("#hero").hidden=true; const dk=$("#dock"); if(dk)dk.hidden=true;
 $("#tools").innerHTML=`<span class="tag">Studio</span>`;
 const g=$("#grid"); g.className="grid studio-wrap"; g.innerHTML=sv();
}
async function loadList(){
 if(!dbx){studio.list=[];renderStudio();return;}
 try{
  const [subs,reps]=await Promise.all([dbx.collection("submissions").get(),dbx.collection("reports").get()]);
  const st={}; reps.docs.forEach(d=>{const v=d.data();if(v)st[d.id]=v.status;});
  studio.list=subs.docs.map(d=>{const v=d.data()||{};return {id:d.id,project:v.project||"Untitled",company:v.company||"",contact:v.contact||"",submittedAt:v.submittedAt||0,status:st[d.id]||v.status||"Submitted",brief:v.brief};}).sort((a,b)=>b.submittedAt-a.submittedAt);
 }catch(e){studio.list=[];studio.msg="Couldn’t load briefs.";}
 renderStudio();
}
async function openSub(id){
 const sub=(studio.list||[]).find(x=>x.id===id); if(!sub)return;
 studio.cur=id; studio.mode="edit"; studio.msg="";
 try{const d=await dbx.doc("reports/"+id).get(); studio.rep=d.exists?JSON.parse(d.data().rep):draftFrom(sub); if(!studio.rep.fit){const fresh=draftFrom(sub);studio.rep.fit=fresh.fit;studio.rep.timing=fresh.timing;saveRep();} if(!d.exists){studio.msg="Draft created from their answers.";await saveRep();}}
 catch(e){studio.rep=draftFrom(sub);}
 renderStudio(); window.scrollTo({top:0});
}
async function saveRep(){ if(!dbx||!studio.cur||!studio.rep)return; try{await dbx.doc("reports/"+studio.cur).set({rep:JSON.stringify(studio.rep),status:studio.rep.status,updatedAt:Date.now()});}catch(e){studio.msg="Couldn’t save just now.";} }
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(saveRep,800);refreshDiagrams();}
function refreshDiagrams(){const R=studio.rep;if(!R)return;const a=$("#dg-fit"),b=$("#dg-road");if(a)a.innerHTML=fitSVG(R);if(b)b.innerHTML=roadmapSVG(R);}
async function aiReview(){
 const R=studio.rep, sub=(studio.list||[]).find(x=>x.id===studio.cur); if(!sample||!sub||studio.busy)return;
 studio.busy=true; studio.msg="Reviewing the brief. This usually takes 20 to 60 seconds."; renderStudio();
 const ctx=withState(JSON.parse(sub.brief),()=>context());
 try{
  const r=await sample.json(`You are a senior consultant at Summit Product Studio reviewing a prospect's software project brief before the report goes back to them. Be specific to this business, practical and direct. British spelling. No em or en dashes. No jargon (no leverage, robust, seamless, holistic, end-to-end).
Find what is missing or risky, write questions to settle before quoting, and write two to four testable acceptance criteria for up to eight of the Must requirements, using their IDs.
Reply with only JSON: {"summary":"three sentences on the project and the brief, written to the client","gaps":[""],"questions":[""],"risks":[{"risk":"","mitigation":""}],"acceptance":[{"id":"REQ-001","criteria":[""]}]}
At most 6 gaps, 6 questions, 5 risks.

Everything we know:
${ctx}

Requirements:
${R.reqs.map(x=>`${x.id} [${x.pri}] [${x.cat}] ${x.text}`).join("\n")}`,{modelTier:"default"});
  if(r.summary)R.summary=String(r.summary);
  (Array.isArray(r.gaps)?r.gaps:[]).forEach(g=>{g=String(g);if(g&&!R.gaps.includes(g))R.gaps.push(g);});
  R.questions=Array.from(new Set(R.questions.concat((Array.isArray(r.questions)?r.questions:[]).map(String))));
  if(Array.isArray(r.risks))R.risks=r.risks.filter(x=>x&&x.risk).map(x=>({risk:String(x.risk),mitigation:String(x.mitigation||"")}));
  (Array.isArray(r.acceptance)?r.acceptance:[]).forEach(a=>{if(a&&a.id&&Array.isArray(a.criteria))R.acceptance[a.id]=a.criteria.map(String);});
  studio.msg="Review added. Edit or delete anything before you send.";
  await saveRep();
 }catch(e){studio.msg=e&&e.code==="rate_limited"?"Too many requests. Try again in a minute.":"The review didn’t finish. Try again.";}
 studio.busy=false; renderStudio();
}
async function studioAct(a,v,i){
 const R=studio.rep;
 switch(a){
  case "leavestudio": history.replaceState(null,"",location.pathname+location.search); location.reload(); return true;
  case "sopen": openSub(v); return true;
  case "sback": studio.cur=null; studio.rep=null; studio.msg=""; await loadList(); return true;
  case "smode": studio.mode=v; renderStudio(); return true;
  case "sreview": aiReview(); return true;
  case "sgdoc": toGoogleDoc(); return true;
  case "srdel": R.reqs.splice(+i,1); renumber(R); saveSoon(); renderStudio(); return true;
  case "sradd": R.reqs.push({id:"",text:"New requirement",cat:"Feature",pri:"Should",src:"Added by Summit"}); renumber(R); saveSoon(); renderStudio(); return true;
  case "sdl": try{await downloads.save({filename:(R.title||"project").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-brief.html",data:reportFile(R)}); studio.msg="Downloaded. Open it in a browser and print to PDF if you want a PDF.";}catch(e){} renderStudio(); return true;
  case "ssend": {
   if(!R.gdoc)return true;
   R.status="Shared"; R.sentAt=Date.now(); await saveRep();
   const body=`${R.note}\n\nHere’s your project brief: ${R.gdoc.url}\n\nComment on anything in the doc, then reply to approve it or tell us what to change, and we’ll come back with a fixed quote.\n\nAnthony`;
   window.open(`mailto:${encodeURIComponent(R.email||"")}?subject=${encodeURIComponent("Your project brief: "+R.title)}&body=${encodeURIComponent(body)}`,"_blank");
   studio.msg="Marked as shared, and your email app should open with a message and the doc link. Remember to share the doc with them in Google Docs first."; renderStudio(); return true; }
 }
 return false;
}
function renumber(R){const old={};R.reqs.forEach((x,k)=>{const nid="REQ-"+String(k+1).padStart(3,"0");if(x.id&&R.acceptance[x.id])old[nid]=R.acceptance[x.id];x.id=nid;});R.acceptance=old;}
document.addEventListener("input",e=>{
 if(!inStudio()||!studio.rep)return; const d=e.target.dataset||{}, R=studio.rep, v=e.target.value;
 if(d.s&&d.s.startsWith("fit")&&R.fit){ const k=d.s.slice(3).toLowerCase(); if(k==="replaced")R.fit.replaced=v; else R.fit[k]=v.split("\n").map(x=>x.trim()).filter(Boolean); saveSoon(); return; }
 if(d.s){ if(["gaps","questions","assumptions"].includes(d.s))R[d.s]=v.split("\n").map(x=>x.trim()).filter(Boolean);
  else if(d.s==="risks")R.risks=v.split("\n").map(x=>x.trim()).filter(Boolean).map(x=>{const k=x.indexOf(":");return k>0?{risk:x.slice(0,k).trim(),mitigation:x.slice(k+1).trim()}:{risk:x,mitigation:""};});
  else R[d.s]=v; saveSoon(); }
 if(d.sb!=null){R.brief[+d.sb][1]=v;saveSoon();}
 if(d.sr!=null){R.reqs[+d.sr].text=v;saveSoon();}
});
document.addEventListener("change",e=>{ if(!inStudio()||!studio.rep)return; const d=e.target.dataset||{}; if(d.srp!=null){studio.rep.reqs[+d.srp].pri=e.target.value;saveSoon();} });
document.addEventListener("click",e=>{ if(!inStudio())return; const b=e.target.closest("[data-act]"); if(!b)return; if(["leavestudio","sopen","sback","smode","sreview","srdel","sradd","sdl","ssend","sgdoc"].includes(b.dataset.act)){e.preventDefault();e.stopImmediatePropagation();studioAct(b.dataset.act,b.dataset.v,b.dataset.i);} },true);
async function bootStudio(){ if(inStudio()){ renderStudio(); if(isOwnerX) loadList(); } }
window.addEventListener("hashchange",()=>location.reload());

/* ---------- boot ---------- */
render();
if(window.claude&&window.claude.use){
 window.claude.use("sample").then(s=>{sample=s; if(s) render(document.activeElement&&document.activeElement.id);}).catch(()=>{});
 window.claude.use("downloads").then(d=>{downloads=d; if(d&&inStudio()) renderStudio();}).catch(()=>{});
 if(inStudio()) window.claude.use("mcp").then(m=>{mcpx=m; if(m&&studio.rep) renderStudio();}).catch(()=>{});
 Promise.all([window.claude.use("user").catch(()=>null),window.claude.use("db").catch(()=>null)]).then(async([u,d])=>{
  userx=u; dbx=d; try{ isOwnerX=u?await u.isOwner():false; }catch(e){ isOwnerX=false; }
  if(inStudio()) bootStudio(); else renderTools();
 });
} else if(inStudio()) renderStudio();
})();
</script>
